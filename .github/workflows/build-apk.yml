name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "EdgeHome-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeHome-${{ github.run_number }}
          path: EdgeHome-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Edge Home build ${{ github.run_number }}
          body: |
            Install on Android: download the APK below, open it, and allow installs from your browser or files app if asked.
            This build runs the prototype with simulated devices. It does not talk to the hub yet.
          files: EdgeHome-${{ github.run_number }}.apk
          make_latest: true
