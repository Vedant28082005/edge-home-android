name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Builds that publish (main, manual) must use the fixed release key.
      # Pull-request builds only check that the app compiles.
      REQUIRE_RELEASE_SIGNING: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore restored."
          elif [ "$REQUIRE_RELEASE_SIGNING" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Add the four signing secrets (see README) and re-run."
            exit 1
          else
            echo "::notice::No keystore secret here; this build is signed with the debug key and is not published."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Check signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found; skipping signature check"
            exit 0
          fi
          echo "Using $APKSIGNER"
          OUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$OUT" | grep -iE "certificate (DN|SHA-256)" || echo "$OUT"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "EdgeHome-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeHome-${{ github.run_number }}
          path: EdgeHome-${{ github.run_number }}.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Edge Home build ${{ github.run_number }}
          body: |
            Install on Android: download the APK below and open it. Builds from now on are signed with the fixed release key and install over each other.
            The app opens the Edge Home dashboard from your hub's gateway (default https://homebench.tailffe052.ts.net).
          files: EdgeHome-${{ github.run_number }}.apk
          make_latest: true
