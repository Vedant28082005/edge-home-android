<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edge Home</title>
<style>
@font-face{font-family:"Inter";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/inter-400.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/inter-500.woff2) format("woff2")}
@font-face{font-family:"Instrument Serif";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/instrument-serif-400.woff2) format("woff2")}
html,body{margin:0}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
</style>
<style>
/* Layout: phone = tabs + bottom bar; desktop (>=1024) = side nav | room | "around the house" rail. Dark-first Obsidian Platinum tokens. */
:root{--bg:#111110;--surface:#1c1b19;--surface-2:#26241f;--surface-3:#34312c;--line:#2e2c28;--line-strong:#45423c;--control-line:#77726a;--ink:#f2ede4;--ink-2:#b5afa4;--ink-3:#8c877d;--accent:#e2dfd8;--on-accent:#111110;--risk:#ff8f87;--risk-fill:#c9373c;--on-risk:#fff;--risk-soft:#33171a;--risk-line:#6e2a2b;--ok:#5bc48a;--ok-soft:#14301f;--warn:#f2b544;--warn-soft:#3a2c10;--info:#8fb2ee;--info-soft:#19253a;--focus:#8fb2ee;--scrim:rgba(0,0,0,.62);--shadow:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);--display:"Instrument Serif","Iowan Old Style",Georgia,serif;--sans:Inter,"SF Pro Text",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f4ef;--surface:#fff;--surface-2:#efece5;--surface-3:#fff;--line:#e3dfd6;--line-strong:#cfcac0;--control-line:#8a847a;--ink:#1a1917;--ink-2:#4f4a42;--ink-3:#6b655b;--accent:#1f1e1b;--on-accent:#f6f4ef;--risk:#b42318;--risk-fill:#b42318;--risk-soft:#fdeceb;--risk-line:#efb4ae;--ok:#1f7a4a;--ok-soft:#e3f4ea;--warn:#8a5a00;--warn-soft:#fdf3dc;--info:#2b53a0;--info-soft:#e6eefb;--focus:#2b53a0;--scrim:rgba(26,25,23,.38);--shadow:0 12px 32px rgba(26,25,23,.12),0 2px 6px rgba(26,25,23,.08);color-scheme:light}}
:root[data-theme="light"]{--bg:#f6f4ef;--surface:#fff;--surface-2:#efece5;--surface-3:#fff;--line:#e3dfd6;--line-strong:#cfcac0;--control-line:#8a847a;--ink:#1a1917;--ink-2:#4f4a42;--ink-3:#6b655b;--accent:#1f1e1b;--on-accent:#f6f4ef;--risk:#b42318;--risk-fill:#b42318;--risk-soft:#fdeceb;--risk-line:#efb4ae;--ok:#1f7a4a;--ok-soft:#e3f4ea;--warn:#8a5a00;--warn-soft:#fdf3dc;--info:#2b53a0;--info-soft:#e6eefb;--focus:#2b53a0;--scrim:rgba(26,25,23,.38);--shadow:0 12px 32px rgba(26,25,23,.12),0 2px 6px rgba(26,25,23,.08);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/22px var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.ico{width:20px;height:20px;flex:none;display:block}
.app{min-height:100%;display:flex}
.side{display:none}
.main{flex:1;min-width:0;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.rail{display:none}
.main.is-chat{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:500}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:36px;padding:0 14px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1px var(--control-line);background:transparent;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer}
.tab.sel{background:var(--accent);color:var(--on-accent);box-shadow:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(var(--n,3),1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:12px;line-height:16px;font-weight:500;color:var(--ink-3);cursor:pointer;min-height:44px}
.tabbar button.sel{color:var(--ink)}
h1.room{margin:0;font:400 44px/46px var(--display);letter-spacing:-.5px;text-wrap:balance}
.sub{margin:0;font-size:13px;line-height:18px;color:var(--ink-2)}
.cap{margin:0;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.2px;color:var(--ink-3)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head .acts{display:flex;gap:8px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px 16px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.val{font-size:20px;line-height:26px;font-weight:500;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.on{border-color:var(--line-strong)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.id{display:flex;align-items:center;gap:12px;min-width:0}
.id>div:last-child{min-width:0}
.tile{width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;flex:none}
.tile .ico{width:22px;height:22px}
.card.on .tile{background:var(--accent);color:var(--on-accent)}
.name{margin:0;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;justify-content:space-between;font-size:13px;line-height:18px;color:var(--ink-2)}
.meta b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.sw{width:48px;height:28px;border-radius:999px;background:var(--surface-2);border:1px solid var(--control-line);position:relative;flex:none;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-2);transition:left .18s ease-out}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{left:23px;background:var(--on-accent)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;--v:50%}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--v),var(--surface-2) var(--v))}
.rng::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--v),var(--surface-2) var(--v))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--ink);border:4px solid var(--surface)}
.rng::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:4px solid var(--surface)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{height:38px;border:0;border-radius:9px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--control-line);background:transparent;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:transform .12s ease-out}
.btn:active{transform:scale(.98)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.icon{width:44px;padding:0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--risk-fill);border-color:var(--risk-fill);color:var(--on-risk)}
.btn.risk{border-color:var(--risk-line);color:var(--risk)}
.btn.block{width:100%}
.btn:focus-visible,.sw:focus-visible,.seg button:focus-visible,.rng:focus-visible,.tab:focus-visible,.tabbar button:focus-visible,.nav:focus-visible,select:focus-visible,.composer input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.2px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge .ico{width:14px;height:14px}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.risk{background:var(--risk-soft);color:var(--risk)}
.badge.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong)}
.card.off{background:var(--bg);border-style:dashed}
.card.off .tile{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3)}
.card.off .name{color:var(--ink-2)}
.dim{opacity:.35;filter:grayscale(1);pointer-events:none}
.card.lock{border-color:var(--risk-line)}
.card.lock .tile{background:var(--risk-soft);color:var(--risk)}
.card.lock.open{background:var(--risk-soft)}
.card.lock.open .tile{background:var(--surface)}
.lockhead{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.2px;color:var(--risk)}
.lockhead .ico{width:14px;height:14px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps i{display:block;height:4px;border-radius:2px;background:var(--surface-2)}
.steps i.done{background:var(--info)}
.steps i.now{background:var(--info);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.setpt{font:400 44px/44px var(--display);font-variant-numeric:tabular-nums;text-align:center}
.vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.nav{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--ink-2);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.nav.sel{background:var(--surface-2);color:var(--ink)}
.nav .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ndot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-strong);flex:none}
.ndot.on{background:var(--accent);box-shadow:none}
.settings{display:flex;flex-direction:column;gap:14px}
.settings label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
.settings select{height:40px;border-radius:10px;border:1px solid var(--control-line);background:var(--surface);padding:0 10px}
.settings .chk{flex-direction:row;align-items:center;gap:10px;min-height:40px}
.settings .chk input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.thread{display:flex;flex-direction:column;gap:22px;max-width:720px;width:100%;margin:0 auto}
.user{align-self:flex-end;max-width:80%;background:var(--surface-2);border-radius:18px 18px 6px 18px;padding:10px 14px}
.ai{display:flex;gap:12px;align-items:flex-start}
.ai-body{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
.ai-body p{margin:0}
.av{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--accent);color:var(--on-accent)}
.av .ico{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:500;letter-spacing:.2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ico{width:14px;height:14px}
.chip .s-ok{color:var(--ok)}.chip .s-run{color:var(--info);animation:spin 1s linear infinite}.chip .s-fail{color:var(--risk)}
.chip.needs{background:var(--risk-soft);color:var(--risk)}
@keyframes spin{to{transform:rotate(360deg)}}
.caret{display:inline-block;width:8px;height:18px;margin-left:2px;vertical-align:-3px;background:var(--ink-2);border-radius:2px}
.confirm{background:var(--surface);border:1px solid var(--risk-line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:460px}
.confirm .acts{display:flex;gap:8px;justify-content:flex-end}
.resolved{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;line-height:18px;color:var(--ink-2)}
.composer-wrap{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line);z-index:4}
.composer{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:26px;padding:6px 6px 6px 18px;max-width:720px;margin:0 auto}
.composer input{flex:1;min-width:0;border:0;background:transparent;height:40px;outline:none}
.composer input::placeholder{color:var(--ink-3)}
.round{width:40px;height:40px;border-radius:999px;border:0;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);cursor:pointer;flex:none}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.suggest button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--control-line);background:transparent;color:var(--ink-2);font-size:13px;cursor:pointer}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.dialog{width:100%;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);animation:up .24s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);align-self:center}
.shield{width:48px;height:48px;border-radius:14px;background:var(--risk-soft);color:var(--risk);display:grid;place-items:center}
.shield .ico{width:26px;height:26px}
.dlg-acts{display:flex;flex-direction:column;gap:8px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .8s linear infinite}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.rail h2{margin:0;font-size:17px;line-height:24px;font-weight:500}
.ritem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);width:100%;text-align:left;cursor:pointer}
.ritem.r{border-color:var(--risk-line)}
.ritem.d{border-style:dashed;background:transparent}
.ritem .t{flex:1;display:flex;flex-direction:column;min-width:0}
.ritem .t span:first-child{font-size:14px;font-weight:500}
.ritem .t span:last-child{font-size:12px;color:var(--ink-3)}
.log{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.log span:first-child{width:60px;flex:none;color:var(--ink-3);font-variant-numeric:tabular-nums}
.log span:last-child{color:var(--ink-2)}
.empty{padding:24px;border:1px dashed var(--line-strong);border-radius:18px;text-align:center;color:var(--ink-2)}
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subnav button{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:0;background:none;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.subnav button.sel{color:var(--ink);border-bottom-color:var(--accent)}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;display:inline-grid;place-items:center}
.node{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px}
.node-grid{display:grid;grid-template-columns:1fr;gap:14px}
.fld{display:grid;gap:6px}
.fld label,.fld .lbl{font-size:13px;line-height:18px;font-weight:500;color:var(--ink-2)}
.inp{width:100%;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--control-line);background:var(--surface);color:var(--ink)}
.inp::placeholder{color:var(--ink-3)}
.inp.err{border-color:var(--risk)}
.inp:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ferr{margin:0;font-size:12px;line-height:16px;color:var(--risk)}
.caps{display:flex;flex-wrap:wrap;gap:6px}
.node-acts{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:1024px){
  .side{display:flex;flex-direction:column;gap:28px;width:248px;flex:none;padding:32px 20px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
  .main,.main.is-chat{padding:44px 48px 28px}
  .rail{display:flex;flex-direction:column;gap:24px;width:320px;flex:none;padding:44px 28px;border-left:1px solid var(--line)}
  .topbar,.tabs,.tabbar,.m-only{display:none!important}
  h1.room{font-size:64px;line-height:64px;letter-spacing:-1px}
  .composer-wrap{position:sticky;bottom:0;left:auto;right:auto;padding:12px 0 0;border-top:0}
  .scrim{align-items:center}
  .dialog{width:440px;border-radius:26px;border:1px solid var(--risk-line);padding:28px}
  .dlg-acts{flex-direction:row-reverse;justify-content:flex-start}
  .grab{display:none}
  .toast{bottom:32px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .node-grid{grid-template-columns:minmax(200px,1.2fr) minmax(150px,1fr) minmax(150px,1fr) auto;align-items:start}
  .node-acts{display:flex;padding-top:24px}
  .tabbar.four{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Navigation" id="side"></aside>
  <main class="main" id="main"></main>
  <aside class="rail" aria-label="Around the house" id="rail"></aside>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="overlay"></div>
<div id="toastHost" aria-live="polite"></div>

<script>
(function(){

0a2 2 0 0 0 -4 0M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6",offline:"M12 18h.01M9.2 15.2a4 4 0 0 1 5.6 0M6.3 12.3a8 8 0 0 1 3.9 -2.1m4.2 .2a8 8 0 0 1 3.3 2M3.5 9.5a12 12 0 0 1 3.5 -2.5m3.1 -.9a12 12 0 0 1 10.4 3.4M3 3l18 18",spark:"M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm0 -12a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm-7 12a6 6 0 0 1 6 -6a6 6 0 0 1 -6 -6a6 6 0 0 1 -6 6a6 6 0 0 1 6 6z",minus:"M5 12h14",plus:"M12 5v14M5 12h14",alert:"M12 9v4M10.4 3.6l-8.1 13.5a1.9 1.9 0 0 0 1.6 2.9h16.2a1.9 1.9 0 0 0 1.6 -2.9l-8.1 -13.5a1.9 1.9 0 0 0 -3.3 0zM12 16h.01",send:"M12 5v14M18 11l-6 -6M6 11l6 -6",stop:"M6 8a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z",refresh:"M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"};
function ic(n,c){return '<svg class="ico'+(c?' '+c:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+P[n]+'"/></svg>';}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

var ROOMS=[{id:"living",name:"Living room"},{id:"bedroom",name:"Bedroom"},{id:"entrance",name:"Entrance"},{id:"kitchen",name:"Kitchen"}];
var GUEST_ROOMS=["living","kitchen"];
var D=[
 {k:"l1",room:"living",type:"light",name:"Ceiling light",on:true,level:72},
 {k:"ac",room:"living",type:"climate",name:"Air conditioner",on:true,target:22.5,mode:"Cool",current:26.1},
 {k:"b1",room:"living",type:"blinds",name:"Main blinds",pos:40,motion:"settled"},
 {k:"l2",room:"living",type:"light",name:"Floor lamp",on:false,level:40,offline:true},
 {k:"f1",room:"bedroom",type:"fan",name:"Ceiling fan",on:true,speed:"Med"},
 {k:"c1",room:"bedroom",type:"blinds",name:"Curtains",pos:20,motion:"settled"},
 {k:"l3",room:"bedroom",type:"light",name:"Bedside lamp",on:false,level:50},
 {k:"lk",room:"entrance",type:"lock",name:"Front door",locked:true},
 {k:"l4",room:"entrance",type:"light",name:"Porch light",on:false,level:100,nodim:true},
 {k:"s1",room:"kitchen",type:"sensor",name:"Air sensor",temp:24.1,hum:58,motionVal:"Clear"},
 {k:"o1",room:"kitchen",type:"outlet",name:"Kettle outlet",on:false}
];
var S={view:"home",room:"living",role:"admin",theme:"system",timeout:false,modal:null,msgs:[],busy:false,log:[],adminTab:"pending",perr:{},approved:[],
 pending:[{k:"p1",type:"light",label:"New light",caps:["On/off","Brightness"],joined:"2 min ago",name:"",room:""},{k:"p2",type:"sensor",label:"New sensor",caps:["Temperature","Humidity","Motion"],joined:"14 min ago",name:"",room:""}]};
var NEXT=1;
function isAdmin(){return S.role==="admin";}
function dev(k){for(var i=0;i<D.length;i++)if(D[i].k===k)return D[i];}
function guest(){return S.role==="guest";}
function rooms(){return guest()?ROOMS.filter(function(r){return GUEST_ROOMS.indexOf(r.id)>-1;}):ROOMS;}
function inRoom(r){return D.filter(function(d){return d.room===r;});}
function visible(d){return !guest()||GUEST_ROOMS.indexOf(d.room)>-1;}
function now(){var t=new Date(),h=t.getHours(),m=t.getMinutes();return (h%12||12)+":"+(m<10?"0":"")+m+" "+(h<12?"am":"pm");}
function addLog(t){S.log.unshift({t:now(),text:t});S.log=S.log.slice(0,6);}
function isOn(d){return !d.offline&&(d.on===true||(d.type==="lock"&&!d.locked));}
function roomName(id){for(var i=0;i<ROOMS.length;i++)if(ROOMS[i].id===id)return ROOMS[i].name;}
function posLabel(p){return p<=0?"Closed":p>=100?"Open":p+"% open";}

function summary(r){var ds=inRoom(r),on=0,off=0,mov=0;ds.forEach(function(d){if(d.offline)off++;else if(d.on)on++;if(d.motion==="settling"||d.motion==="accepted")mov++;});
 var s=[ds.length+" devices"];if(on)s.push(on+" on");if(mov)s.push(mov+" moving");if(off)s.push(off+" offline");
 var lk=ds.filter(function(d){return d.type==="lock";})[0];if(lk)s.push(lk.locked?"Locked":"Unlocked");return s.join(" · ");}

function badgeVO(){return '<span class="badge line">'+ic("eye")+'View only</span>';}
function sw(d){return '<button class="sw" role="switch" aria-checked="'+(!!d.on)+'" aria-label="'+esc(d.name)+'" data-act="toggle" data-k="'+d.k+'"></button>';}
function head(d,icon,sub,right){return '<div class="row"><div class="id"><div class="tile">'+ic(icon)+'</div><div><p class="name">'+esc(d.name)+'</p><p class="sub">'+sub+'</p></div></div>'+(right||"")+'</div>';}

function card(d){
 var g=guest(),cls="card";
 if(d.offline){var lvl=d.type==="light"&&!d.nodim?'<div class="dim" aria-hidden="true"><div class="meta"><span>Brightness</span><b>'+d.level+'%</b></div><input class="rng" type="range" value="'+d.level+'" style="--v:'+d.level+'%" tabindex="-1" disabled></div>':"";
  return '<div class="card off">'+head(d,d.type==="light"?"bulb":"plug","Not responding",'<span class="badge">'+ic("offline")+'Offline</span>')+(g?"":lvl)+'</div>';}
 if(d.type==="light"){var on=d.on;var sub=on?(g&&!d.nodim?"On · "+d.level+"%":"On"):"Off";
  var h='<div class="card'+(on?" on":"")+'">'+head(d,"bulb",sub,g?badgeVO():sw(d));
  if(!g&&on&&!d.nodim)h+='<div><div class="meta"><span>Brightness</span><b data-lv="'+d.k+'">'+d.level+'%</b></div><input class="rng" type="range" min="1" max="100" step="1" value="'+d.level+'" style="--v:'+d.level+'%" aria-label="'+esc(d.name)+' brightness" data-act="level" data-k="'+d.k+'"></div>';
  return h+'</div>';}
 if(d.type==="fan"){var h2='<div class="card'+(d.on?" on":"")+'">'+head(d,"fan",d.on?"On · "+(d.speed==="Med"?"Medium":d.speed):"Off",g?badgeVO():sw(d));
  if(!g&&d.on)h2+='<div class="seg" role="group" aria-label="Fan speed">'+["Low","Med","High"].map(function(s){return '<button aria-pressed="'+(d.speed===s)+'" data-act="speed" data-k="'+d.k+'" data-v="'+s+'">'+s+'</button>';}).join("")+'</div>';
  return h2+'</div>';}
 if(d.type==="outlet")return '<div class="card'+(d.on?" on":"")+'">'+head(d,"plug",d.on?"On":"Off",g?badgeVO():sw(d))+'</div>';
 if(d.type==="climate"){var mv={Cool:"Cooling",Auto:"Auto",Fan:"Fan only",Dry:"Drying"}[d.mode];
  var h3='<div class="card'+(d.on?" on":"")+'">'+head(d,"thermo",d.on?mv+" · room "+d.current.toFixed(1)+"°"+(g?" · target "+d.target.toFixed(1)+"°":""):"Off · room "+d.current.toFixed(1)+"°",g?badgeVO():sw(d));
  if(!g&&d.on){h3+='<div class="row"><button class="btn icon" aria-label="Lower target" data-act="tgt" data-k="'+d.k+'" data-v="-0.5">'+ic("minus")+'</button><div><div class="setpt">'+d.target.toFixed(1)+'°</div><p class="cap" style="text-align:center">Target</p></div><button class="btn icon" aria-label="Raise target" data-act="tgt" data-k="'+d.k+'" data-v="0.5">'+ic("plus")+'</button></div>';
   h3+='<div class="seg" role="group" aria-label="Mode">'+["Cool","Auto","Fan","Dry"].map(function(s){return '<button aria-pressed="'+(d.mode===s)+'" data-act="mode" data-k="'+d.k+'" data-v="'+s+'">'+s+'</button>';}).join("")+'</div>';}
  return h3+'</div>';}
 if(d.type==="blinds"){var m=d.motion,moving=m==="accepted"||m==="settling",right,sub2;
  if(moving){right='<span class="badge info"><span class="dot"></span>'+(m==="accepted"?"Accepted":"Settling")+'</span>';sub2="Moving to "+d.target+"%";}
  else if(m==="noresult"){right='<span class="badge warn">'+ic("alert")+'No result</span>';sub2="Last known "+d.pos+"%";}
  else {right=g?badgeVO():"";sub2=posLabel(d.pos);}
  var h4='<div class="card'+(moving?" on":"")+'">'+head(d,"blinds",sub2,right);
  if(moving)h4+='<div style="display:grid;gap:6px"><div class="steps" aria-hidden="true"><i class="done"></i><i class="'+(m==="settling"?"now":"")+'"></i><i></i></div><div class="meta" style="font-size:12px"><span>Accepted</span><span>Settling</span><span>Settled</span></div></div>'+(g?"":'<button class="btn sm" data-act="stop" data-k="'+d.k+'">'+ic("stop")+'Stop</button>');
  else if(m==="noresult"&&!g)h4+='<p class="sub">It didn\'t report its new position in time. Check the '+esc(d.name.toLowerCase())+', then try again.</p><div><button class="btn sm" data-act="retry" data-k="'+d.k+'">'+ic("refresh")+'Try again</button></div>';
  else if(!g)h4+='<div><div class="meta"><span>Position</span><b data-lv="'+d.k+'">'+d.pos+'%</b></div><input class="rng" type="range" min="0" max="100" step="5" value="'+d.pos+'" style="--v:'+d.pos+'%" aria-label="'+esc(d.name)+' position" data-act="pos" data-k="'+d.k+'"></div><div style="display:flex;gap:8px"><button class="btn sm" style="flex:1" data-act="move" data-k="'+d.k+'" data-v="0">Close</button><button class="btn sm" style="flex:1" data-act="move" data-k="'+d.k+'" data-v="100">Open</button></div>';
  return h4+'</div>';}
 if(d.type==="lock"){var L=d.locked;
  var h5='<div class="card lock'+(L?"":" open")+'"><div class="lockhead">'+ic("shield")+'Secured device</div>'+head(d,L?"lock":"unlock",L?"Locked":"Unlocked",L?'<span class="badge line">Locked</span>':'<span class="badge risk">Unlocked</span>');
  if(!g)h5+=L?'<button class="btn risk block" data-act="unlock" data-k="'+d.k+'">'+ic("unlock")+'Unlock…</button>':'<button class="btn primary block" data-act="lock" data-k="'+d.k+'">'+ic("lock")+'Lock</button>';
  return h5+'</div>';}
 if(d.type==="sensor")return '<div class="card">'+head(d,"gauge","Updated just now","")+'<div class="vals"><div><p class="cap">Temp</p><div class="val">'+d.temp.toFixed(1)+'°</div></div><div><p class="cap">Humidity</p><div class="val">'+d.hum+'%</div></div><div><p class="cap">Motion</p><div class="val">'+d.motionVal+'</div></div></div></div>';
 return "";}

function strip(r){var items=[];inRoom(r).forEach(function(d){if(d.offline)return;
 if(d.type==="sensor"){items.push(["Temp",d.temp.toFixed(1)+"°"]);items.push(["Humidity",d.hum+"%"]);}
 if(d.type==="climate"&&d.on)items.push(["AC target",d.target.toFixed(1)+"°"]);
 if(d.type==="blinds")items.push([d.name,d.pos+"%"]);
 if(d.type==="lock")items.push(["Door",d.locked?"Locked":"Open"]);});
 if(!items.length)return "";
 return '<div class="strip">'+items.slice(0,4).map(function(i){return '<div><p class="cap">'+esc(i[0])+'</p><div class="val">'+i[1]+'</div></div>';}).join("")+'</div>';}

function lockChip(){var lk=dev("lk");if(!visible(lk))return "";
 return '<button class="badge '+(lk.locked?"line":"risk")+'" style="border:0;cursor:pointer;height:32px" data-act="goroom" data-v="entrance">'+ic(lk.locked?"lock":"unlock")+'Front door '+(lk.locked?"locked":"unlocked")+'</button>';}

function renderHome(){
 var rs=rooms();if(!rs.some(function(r){return r.id===S.room;}))S.room=rs[0].id;
 var r=S.room,canAct=!guest();
 var tabs='<div class="tabs" role="tablist">'+rs.map(function(x){return '<button class="tab'+(x.id===r?" sel":"")+'" role="tab" aria-selected="'+(x.id===r)+'" data-act="goroom" data-v="'+x.id+'">'+x.name+'</button>';}).join("")+'</div>';
 var hasOff=inRoom(r).some(function(d){return d.on&&!d.offline&&d.type!=="climate";});
 var acts='<div class="acts">'+(guest()?badgeVO():(hasOff?'<button class="btn sm" data-act="alloff" data-v="'+r+'">All off</button>':""))+'<button class="btn sm primary" data-act="view" data-v="chat" style="display:none" id="askbtn">'+ic("spark")+'Ask Edge Home</button></div>';
 return '<div class="topbar m-only"><span class="brand">'+ic("home")+'Edge Home</span>'+lockChip()+'</div>'+tabs+
 '<div class="head"><div><p class="cap" style="margin-bottom:6px">'+summary(r)+'</p><h1 class="room">'+roomName(r)+'</h1></div>'+acts+'</div>'+strip(r)+
 '<div class="grid">'+inRoom(r).map(card).join("")+'</div>';}

function chipHtml(c){var st=c.s==="ok"?ic("check","s-ok"):c.s==="run"?ic("loader","s-run"):c.s==="fail"?ic("x","s-fail"):ic("shield");return '<span class="chip'+(c.s==="needs"?" needs":"")+'">'+st+esc(c.label)+'</span>';}
function renderChat(){
 var t='<div class="topbar m-only"><span class="brand">'+ic("chat")+'Chat</span><button class="btn sm" data-act="newchat">New chat</button></div>';
 t+='<div class="head" style="display:none" id="dchead"></div>';
 var th='<div class="thread" id="thread">';
 if(!S.msgs.length){th+='<div style="text-align:center;padding:32px 0 8px"><h1 class="room" style="font-size:40px;line-height:44px">Ask your home</h1><p class="sub" style="margin-top:8px">Runs on your hub. '+(guest()?"You have view-only access, so you can ask how things are.":"Locks always ask you to confirm.")+'</p></div><div class="suggest">'+(guest()?["What's it like in the kitchen?","Is the living room light on?"]:["Dim the living room to 40%","Close the bedroom curtains","Unlock the front door","What's it like in the kitchen?"]).map(function(s){return '<button data-act="suggest" data-v="'+esc(s)+'">'+esc(s)+'</button>';}).join("")+'</div>';}
 S.msgs.forEach(function(m,i){
  if(m.from==="user"){th+='<div class="user">'+esc(m.text)+'</div>';return;}
  th+='<div class="ai"><div class="av">'+ic("spark")+'</div><div class="ai-body">';
  if(m.chips&&m.chips.length)th+='<div class="chips">'+m.chips.map(chipHtml).join("")+'</div>';
  if(m.confirm&&m.confirm.state!=="pending"&&m.confirm.state!=="confirming")th+='<div class="resolved"><span class="badge '+(m.confirm.state==="confirmed"?"ok":"")+'">'+(m.confirm.state==="confirmed"?ic("check")+"Confirmed":"Cancelled")+'</span>'+esc(m.confirm.summary)+'</div>';
  th+='<p>'+esc(m.shown||"")+(m.streaming?'<span class="caret" aria-hidden="true"></span>':"")+'</p>';
  if(m.confirm&&(m.confirm.state==="pending"||m.confirm.state==="confirming")&&!m.streaming)th+='<div class="confirm"><div class="lockhead">'+ic("shield")+'Needs your confirmation</div><p style="margin:0">'+esc(m.confirm.summary)+'</p><div class="acts"><button class="btn" data-act="ccancel" data-v="'+i+'">Cancel</button>'+(m.confirm.state==="confirming"?'<button class="btn danger" aria-busy="true"><span class="spin" aria-hidden="true"></span>Confirming…</button>':'<button class="btn danger" data-act="cconfirm" data-v="'+i+'">Confirm</button>')+'</div></div>';
  th+='</div></div>';});
 th+='</div>';
 var comp='<form class="composer-wrap" id="cform"><div class="composer"><label class="sr" for="msg">Message</label><input id="msg" autocomplete="off" placeholder="'+(guest()?"Ask about your rooms…":"Ask to change something…")+'"><button class="round" type="submit" aria-label="'+(S.busy?"Stop reply":"Send")+'">'+ic(S.busy?"stop":"send")+'</button></div></form>';
 return t+'<div class="desk-chat-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)"><div><h1 class="room" style="font-size:36px;line-height:40px">Chat</h1><p class="sub">Runs on your hub. Changes show up on your devices right away.</p></div><button class="btn sm" data-act="newchat">New chat</button></div>'+th+'<div style="flex:1"></div>'+comp;}

function renderAdmin(){
 var h='<div class="topbar m-only"><span class="brand">'+ic("shield")+'Admin</span></div><div><p class="cap" style="margin-bottom:6px">Only admins see this</p><h1 class="room">Admin</h1></div>';
 h+='<div class="subnav" role="tablist">'+[["pending","Pending nodes"],["users","Users and rooms"],["log","Action log"]].map(function(t){return '<button role="tab" class="'+(S.adminTab===t[0]?"sel":"")+'" aria-selected="'+(S.adminTab===t[0])+'" data-act="atab" data-v="'+t[0]+'">'+t[1]+(t[0]==="pending"&&S.pending.length?'<span class="cnt">'+S.pending.length+'</span>':"")+'</button>';}).join("")+'</div>';
 if(S.adminTab!=="pending")return h+'<div class="empty">This screen is the next one in the design. It lands here as soon as it\'s drawn.</div>';
 h+='<p class="sub" style="max-width:640px;font-size:14px;line-height:20px">New devices that joined your hub. Give each one a name and a room, then approve it. Nothing can control a node until it\'s approved.</p>';
 if(!S.pending.length)h+='<div class="empty"><p style="margin:0 0 4px;font-weight:500;color:var(--ink)">No new devices</p><p class="sub" style="margin:0">Power on a new node near the hub. It shows up here within a minute.</p><div style="margin-top:14px"><button class="btn sm" data-act="simjoin">Simulate a new node</button></div></div>';
 S.pending.forEach(function(n){var e=S.perr[n.k]||{};
  h+='<div class="node"><div class="node-grid"><div class="id" style="align-items:flex-start"><div class="tile">'+ic(n.type==="light"?"bulb":n.type==="fan"?"fan":"gauge")+'</div><div style="display:flex;flex-direction:column;gap:8px"><div><p class="name">'+esc(n.label)+'</p><p class="sub">Joined '+n.joined+'</p></div><div class="caps">'+n.caps.map(function(c){return '<span class="badge line">'+c+'</span>';}).join("")+'</div></div></div>';
  h+='<div class="fld"><label for="pn-'+n.k+'">Name</label><input class="inp'+(e.name?" err":"")+'" id="pn-'+n.k+'" data-act="pname" data-k="'+n.k+'" value="'+esc(n.name)+'" placeholder="'+(n.type==="light"?"Hallway light":n.type==="fan"?"Study fan":"Bedroom sensor")+'"'+(e.name?' aria-invalid="true" aria-describedby="pe-'+n.k+'"':"")+'>'+(e.name?'<p class="ferr" id="pe-'+n.k+'">Give it a name first.</p>':"")+'</div>';
  h+='<div class="fld"><label for="pr-'+n.k+'">Room</label><select class="inp'+(e.room?" err":"")+'" id="pr-'+n.k+'" data-act="proom" data-k="'+n.k+'"'+(e.room?' aria-invalid="true" aria-describedby="pre-'+n.k+'"':"")+'><option value="">Choose a room</option>'+ROOMS.map(function(r){return '<option value="'+r.id+'"'+(n.room===r.id?" selected":"")+'>'+r.name+'</option>';}).join("")+'</select>'+(e.room?'<p class="ferr" id="pre-'+n.k+'">Choose a room first.</p>':"")+'</div>';
  h+='<div class="node-acts"><button class="btn" data-act="preject" data-k="'+n.k+'">Reject</button><button class="btn primary" data-act="papprove" data-k="'+n.k+'">Approve</button></div></div></div>';});
 if(S.approved.length)h+='<div style="display:flex;flex-direction:column;gap:10px"><p class="cap">Approved recently</p>'+S.approved.map(function(a){return '<button class="ritem" data-act="goroom" data-v="'+a.room+'"><span style="color:var(--ok)">'+ic("check")+'</span><span class="t"><span>'+esc(a.name)+'</span><span>'+roomName(a.room)+' · just now</span></span></button>';}).join("")+'</div>';
 return h;}
function approve(k){var n=S.pending.filter(function(x){return x.k===k;})[0];var e={};if(!n.name.trim())e.name=1;if(!n.room)e.room=1;S.perr[k]=e;
 if(e.name||e.room){render();var f=document.getElementById(e.name?"pn-"+k:"pr-"+k);if(f)f.focus();return;}
 var nd={k:"n"+(NEXT++),room:n.room,name:n.name.trim()};
 if(n.type==="light"){nd.type="light";nd.on=false;nd.level=80;}else if(n.type==="fan"){nd.type="fan";nd.on=false;nd.speed="Low";}else{nd.type="sensor";nd.temp=23.6;nd.hum=51;nd.motionVal="Clear";}
 D.push(nd);S.pending=S.pending.filter(function(x){return x.k!==k;});S.approved.unshift({name:nd.name,room:nd.room});addLog("You added the "+nd.name.toLowerCase()+" to the "+roomName(nd.room).toLowerCase());toast(nd.name+" added to "+roomName(nd.room));render();}
function settingsHtml(){return '<div class="settings"><p class="cap">Prototype settings</p>'+
 '<label for="role">Signed in as<select id="role" data-act="role"><option value="admin"'+(S.role==="admin"?" selected":"")+'>Vedant · Admin</option><option value="member"'+(S.role==="member"?" selected":"")+'>Riya · Member</option><option value="guest"'+(S.role==="guest"?" selected":"")+'>Arjun · Guest (2 rooms)</option></select></label>'+
 '<label for="theme">Theme<select id="theme" data-act="theme"><option value="system"'+(S.theme==="system"?" selected":"")+'>Match system</option><option value="dark"'+(S.theme==="dark"?" selected":"")+'>Obsidian (dark)</option><option value="light"'+(S.theme==="light"?" selected":"")+'>Ivory (light)</option></select></label>'+
 '<label class="chk" for="tmo"><input type="checkbox" id="tmo" data-act="timeout"'+(S.timeout?" checked":"")+'>Next blind move times out</label>'+
 '<label class="chk" for="offl"><input type="checkbox" id="offl" data-act="offline"'+(dev("l2").offline?" checked":"")+'>Floor lamp offline</label></div>';}

function renderSettings(){return '<div class="topbar"><span class="brand">'+ic("gear")+'Settings</span></div><h1 class="room" style="font-size:40px;line-height:44px">Prototype</h1><p class="sub">Switch roles to see the guest view-only state. Nothing here leaves this page.</p><div class="card">'+settingsHtml()+'</div>';}

function renderSide(){var h='<div class="brand" style="padding:0 12px">'+ic("home")+'Edge Home</div><div style="display:flex;flex-direction:column;gap:2px"><p class="cap" style="padding:0 12px 6px">Rooms</p>';
 rooms().forEach(function(r){var ds=inRoom(r.id),on=ds.filter(function(d){return d.on&&!d.offline;}).length,lk=ds.filter(function(d){return d.type==="lock";})[0];
  var n=lk?(lk.locked?"Locked":"Unlocked"):on?on+" on":"All off";
  h+='<button class="nav'+(S.view==="home"&&S.room===r.id?" sel":"")+'" data-act="goroom" data-v="'+r.id+'"><span class="ndot'+(on?" on":"")+'" aria-hidden="true"></span>'+r.name+'<span class="n">'+n+'</span></button>';});
 h+='</div><div style="display:flex;flex-direction:column;gap:2px"><button class="nav'+(S.view==="chat"?" sel":"")+'" data-act="view" data-v="chat">'+ic("chat")+'Chat</button>'+(isAdmin()?'<button class="nav'+(S.view==="admin"?" sel":"")+'" data-act="view" data-v="admin">'+ic("shield")+'Admin'+(S.pending.length?'<span class="n">'+S.pending.length+' pending</span>':"")+'</button>':"")+'</div>';
 h+='<div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--line)">'+settingsHtml()+'</div>';return h;}

function renderRail(){var h='<h2>Around the house</h2>';var lk=dev("lk");
 if(visible(lk))h+='<div style="display:flex;flex-direction:column;gap:10px"><p class="cap">Secured</p><button class="ritem r" data-act="goroom" data-v="entrance"><span style="color:var(--risk)">'+ic(lk.locked?"lock":"unlock")+'</span><span class="t"><span>Front door</span><span>Entrance</span></span><span class="badge '+(lk.locked?"line":"risk")+'">'+(lk.locked?"Locked":"Unlocked")+'</span></button></div>';
 var att=D.filter(function(d){return visible(d)&&(d.offline||d.motion==="settling"||d.motion==="accepted"||d.motion==="noresult");});
 h+='<div style="display:flex;flex-direction:column;gap:10px"><p class="cap">Needs attention</p>';
 if(!att.length)h+='<p class="sub">Everything is responding.</p>';
 att.forEach(function(d){var b=d.offline?'<span class="badge">Offline</span>':d.motion==="noresult"?'<span class="badge warn">No result</span>':'<span class="badge info"><span class="dot"></span>Settling</span>';
  h+='<button class="ritem'+(d.offline?" d":"")+'" data-act="goroom" data-v="'+d.room+'"><span class="t"><span>'+esc(d.name)+'</span><span>'+roomName(d.room)+'</span></span>'+b+'</button>';});
 h+='</div><div style="display:flex;flex-direction:column"><p class="cap" style="padding-bottom:6px">Recent</p>';
 if(!S.log.length)h+='<p class="sub">Changes you or the assistant make show up here.</p>';
 S.log.forEach(function(l){h+='<div class="log"><span>'+l.t+'</span><span>'+esc(l.text)+'</span></div>';});
 return h+'</div>';}

function renderTabbar(){var t=[["home","home","Home"],["chat","chat","Chat"]];if(isAdmin())t.push(["admin","shield","Admin"]);t.push(["settings","gear","Settings"]);document.getElementById("tabbar").style.setProperty("--n",t.length);return t.map(function(t){return '<button class="'+(S.view===t[0]?"sel":"")+'" data-act="view" data-v="'+t[0]+'"'+(S.view===t[0]?' aria-current="page"':"")+'>'+ic(t[1])+t[2]+'</button>';}).join("");}

function renderModal(){var o=document.getElementById("overlay");if(!S.modal){o.innerHTML="";return;}
 var c=S.modal.step==="confirming";
 o.innerHTML='<div class="scrim" data-act="mcancel-bg"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgt"><div class="grab" aria-hidden="true"></div><div class="shield">'+ic("shield")+'</div><div style="display:flex;flex-direction:column;gap:6px"><h2 id="dlgt" style="margin:0;font-size:13px;line-height:18px;font-weight:500;color:var(--risk);letter-spacing:.2px">Needs your confirmation</h2><p style="margin:0;font:400 30px/34px var(--display)">Unlock the front door.</p></div><div class="dlg-acts">'+(c?'<button class="btn danger" aria-busy="true"><span class="spin" aria-hidden="true"></span>Confirming…</button>':'<button class="btn danger" data-act="mconfirm" id="mconf">Confirm</button>')+'<button class="btn" data-act="mcancel">Cancel</button></div></div></div>';
 if(!c){var b=document.getElementById("mconf");if(b)b.focus();}}

function toast(t){var h=document.getElementById("toastHost");h.innerHTML='<div class="toast" role="status"><span style="color:var(--ok)">'+ic("check")+'</span>'+esc(t)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){h.innerHTML="";},2400);}

function applyTheme(){var r=document.documentElement;if(S.theme==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme);}

function render(){
 var main=document.getElementById("main");var keepMsg=document.getElementById("msg");var draft=keepMsg?keepMsg.value:"";var hadFocus=keepMsg&&document.activeElement===keepMsg;
 main.classList.toggle("is-chat",S.view==="chat");
 if(S.view==="admin"&&!isAdmin())S.view="home";
 main.innerHTML=S.view==="chat"?renderChat():S.view==="settings"?renderSettings():S.view==="admin"?renderAdmin():renderHome();
 var desk=window.matchMedia("(min-width:1024px)").matches;
 var ask=document.getElementById("askbtn");if(ask)ask.style.display=desk?"":"none";
 var dch=main.querySelector(".desk-chat-head");if(dch)dch.style.display=desk?"flex":"none";
 document.getElementById("side").innerHTML=renderSide();
 document.getElementById("rail").innerHTML=renderRail();
 document.getElementById("tabbar").innerHTML=renderTabbar();
 var m=document.getElementById("msg");if(m){m.value=draft;if(hadFocus)m.focus();}
 var th=document.getElementById("thread");if(th&&S.view==="chat")window.scrollTo(0,document.body.scrollHeight);
 renderModal();}

/* ---------- device actions (simulated gateway) ---------- */
function setOn(d,v,by){d.on=v;addLog((by||"You")+" turned "+(v?"on":"off")+" the "+d.name.toLowerCase());}
function move(d,target,by){if(d.offline)return;d.target=target;d.motion="accepted";var fail=S.timeout;S.timeout=false;addLog((by||"You")+" moved the "+d.name.toLowerCase()+" to "+target+"%");render();
 clearTimeout(d.t1);clearInterval(d.t2);
 d.t1=setTimeout(function(){d.motion="settling";render();var from=d.pos,steps=12,i=0;
  d.t2=setInterval(function(){i++;if(!fail)d.pos=Math.round(from+(target-from)*i/steps);
   if(i>=steps){clearInterval(d.t2);if(fail){d.motion="noresult";}else{d.motion="settled";d.pos=target;}render();chatSettle(d);}},220);},500);}
function stop(d){clearTimeout(d.t1);clearInterval(d.t2);d.motion="settled";addLog("You stopped the "+d.name.toLowerCase()+" at "+d.pos+"%");render();}
function unlockDone(by){var lk=dev("lk");lk.locked=false;addLog((by||"You")+" unlocked the front door");toast("Front door unlocked");}

/* ---------- chat agent (local simulation) ---------- */
function stream(m,text,done){m.text=text;m.shown="";m.streaming=true;S.busy=true;render();var i=0;
 var iv=setInterval(function(){i+=2;m.shown=text.slice(0,i);if(i>=text.length){clearInterval(iv);m.shown=text;m.streaming=false;S.busy=false;render();if(done)done();}else{var ps=document.querySelectorAll(".ai-body p");var p=ps[ps.length-1];if(p)p.innerHTML=esc(m.shown)+'<span class="caret" aria-hidden="true"></span>';}},18);}
function chatSettle(d){S.msgs.forEach(function(m){(m.chips||[]).forEach(function(c){if(c.dk===d.k&&c.s==="run"){c.s=d.motion==="noresult"?"fail":"ok";c.label=d.name+(d.motion==="noresult"?" · No result":" · "+posLabel(d.pos));}});});if(S.view==="chat")render();}
function findRoom(t){for(var i=0;i<ROOMS.length;i++){var n=ROOMS[i].name.toLowerCase();if(t.indexOf(n)>-1||t.indexOf(n.split(" ")[0])>-1)return ROOMS[i].id;}return null;}
function agent(text){var t=text.toLowerCase(),m={from:"ai",chips:[]};S.msgs.push(m);
 var room=findRoom(t);
 if(guest()){
  if(/kitchen|temp|humid|like/.test(t)){var s=dev("s1");m.chips.push({s:"ok",label:"Kitchen air sensor · Read"});return stream(m,"It's "+s.temp.toFixed(1)+"° in the kitchen with "+s.hum+"% humidity, and motion is "+s.motionVal.toLowerCase()+".");}
  if(/light|on\b|off\b/.test(t)){var l=dev("l1");return stream(m,"The living room ceiling light is "+(l.on?"on at "+l.level+"%":"off")+". You have view-only access, so I can tell you how things are but can't change them.");}
  return stream(m,"You have view-only access to the living room and kitchen, so I can't change devices. Ask me how things are, like the kitchen temperature.");}
 if(/\bunlock/.test(t)){m.chips.push({s:"needs",label:"Front door · Needs confirmation",dk:"lk"});m.confirm={state:"pending",summary:"Unlock the front door."};
  if(/porch/.test(t)){var pl=dev("l4");setOn(pl,true,"Assistant");m.chips.unshift({s:"ok",label:"Porch light · On"});}
  return stream(m,(/porch/.test(t)?"The porch light is on. ":"")+"The front door is a secured device, so I need your OK before unlocking it.");}
 if(/\block/.test(t)){var lk=dev("lk");lk.locked=true;addLog("Assistant locked the front door");m.chips.push({s:"ok",label:"Front door · Locked"});return stream(m,"The front door is locked.");}
 if(/curtain|blind/.test(t)){var bd=/curtain/.test(t)||room==="bedroom"?dev("c1"):dev("b1");var tg=/open/.test(t)?100:/close|shut/.test(t)?0:(t.match(/(\d{1,3})\s*%/)||[])[1];
  if(tg===undefined)return stream(m,"Do you want the "+bd.name.toLowerCase()+" open, closed, or at a percentage?");tg=Math.max(0,Math.min(100,+tg));
  m.chips.push({s:"run",label:bd.name+" · "+(tg===0?"Close":tg===100?"Open":tg+"%"),dk:bd.k});move(bd,tg,"Assistant");return stream(m,"The "+bd.name.toLowerCase()+" are moving now and should settle in a few seconds.");}
 if(/kitchen|temp|humid|like in/.test(t)&&!/light|fan/.test(t)){var s2=dev("s1");m.chips.push({s:"ok",label:"Kitchen air sensor · Read"});return stream(m,"It's "+s2.temp.toFixed(1)+"° in the kitchen with "+s2.hum+"% humidity, and motion is "+s2.motionVal.toLowerCase()+". The kettle outlet is "+(dev("o1").on?"on":"off")+".");}
 if(/all off|everything off/.test(t)){var n=0;D.forEach(function(d){if((!room||d.room===room)&&d.on&&!d.offline&&d.type!=="climate"){d.on=false;n++;m.chips.push({s:"ok",label:d.name+" · Off"});}});addLog("Assistant turned "+n+" devices off");return stream(m,n?"Done, "+n+" device"+(n>1?"s are":" is")+" off.":"Everything was already off.");}
 if(/fan/.test(t)){var f=dev("f1");var sp=/high/.test(t)?"High":/low/.test(t)?"Low":/med/.test(t)?"Med":null;if(/off/.test(t)){setOn(f,false,"Assistant");m.chips.push({s:"ok",label:"Ceiling fan · Off"});return stream(m,"The bedroom fan is off.");}
  setOn(f,true,"Assistant");if(sp)f.speed=sp;m.chips.push({s:"ok",label:"Ceiling fan · "+f.speed});return stream(m,"The bedroom fan is on at "+(f.speed==="Med"?"medium":f.speed.toLowerCase())+".");}
 if(/light|lamp|dim|bright/.test(t)){var lights=D.filter(function(d){return d.type==="light"&&(room?d.room===room:d.room==="living");});var pct=(t.match(/(\d{1,3})\s*%/)||[])[1];var off=/\boff\b/.test(t);var out=[];
  lights.forEach(function(l){if(l.offline){m.chips.push({s:"fail",label:l.name+" · Offline"});out.push(l.name.toLowerCase()+" isn't responding");return;}
   if(off){l.on=false;m.chips.push({s:"ok",label:l.name+" · Off"});}else{l.on=true;if(pct&&!l.nodim)l.level=Math.max(1,Math.min(100,+pct));m.chips.push({s:"ok",label:l.name+" · "+(l.nodim?"On":l.level+"%")});}});
  addLog("Assistant changed the "+roomName(room||"living").toLowerCase()+" lights");
  return stream(m,(off?"Done, the lights are off":"Done, the "+roomName(room||"living").toLowerCase()+" lights are "+(pct?"at "+pct+"%":"on"))+"."+(out.length?" The "+out.join(", ")+", so I skipped it.":""));}
 return stream(m,"I can control lights, the fan, blinds and curtains, the AC and the front door. Try \"dim the living room to 40%\" or \"close the bedroom curtains\".");}
function send(text){text=text.trim();if(!text||S.busy)return;S.msgs.push({from:"user",text:text});render();setTimeout(function(){agent(text);},350);}

/* ---------- events ---------- */
document.addEventListener("click",function(e){var el=e.target.closest("[data-act]");if(!el)return;var a=el.getAttribute("data-act"),k=el.getAttribute("data-k"),v=el.getAttribute("data-v"),d=k?dev(k):null;
 if(a==="mcancel-bg"&&e.target!==el)return;
 switch(a){
  case "toggle":setOn(d,!d.on);render();break;
  case "speed":d.speed=v;render();break;
  case "mode":d.mode=v;render();break;
  case "tgt":d.target=Math.max(16,Math.min(30,d.target+ +v));render();break;
  case "move":move(d,+v);break;
  case "stop":stop(d);break;
  case "retry":move(d,d.target);break;
  case "unlock":S.modal={step:"pending"};renderModal();break;
  case "lock":d.locked=true;addLog("You locked the front door");toast("Front door locked");render();break;
  case "mcancel":case "mcancel-bg":S.modal=null;renderModal();break;
  case "mconfirm":S.modal.step="confirming";renderModal();setTimeout(function(){S.modal=null;unlockDone();render();},1100);break;
  case "alloff":D.forEach(function(x){if(x.room===v&&x.on&&!x.offline&&x.type!=="climate")x.on=false;});addLog("You turned off everything in the "+roomName(v).toLowerCase());render();break;
  case "goroom":S.room=v;S.view="home";render();window.scrollTo(0,0);break;
  case "view":S.view=v;render();if(v!=="chat")window.scrollTo(0,0);break;
  case "suggest":send(v);break;
  case "newchat":S.msgs=[];render();break;
  case "atab":S.adminTab=v;render();break;
  case "papprove":approve(k);break;
  case "preject":var pn=S.pending.filter(function(x){return x.k===k;})[0];S.pending=S.pending.filter(function(x){return x.k!==k;});addLog("You rejected a "+pn.label.toLowerCase().replace("new ","")+" node");toast("Node rejected");render();break;
  case "simjoin":S.pending.push({k:"p"+(NEXT++),type:"fan",label:"New fan",caps:["On/off","Speed"],joined:"just now",name:"",room:""});render();break;
  case "cconfirm":var m=S.msgs[+v];m.confirm.state="confirming";render();setTimeout(function(){m.confirm.state="confirmed";m.chips.forEach(function(c){if(c.s==="needs"){c.s="ok";c.label="Front door · Unlocked";}});unlockDone("Assistant");render();},1100);break;
  case "ccancel":var m2=S.msgs[+v];m2.confirm.state="cancelled";m2.chips.forEach(function(c){if(c.s==="needs"){c.s="fail";c.label="Front door · Cancelled";}});render();break;
 }});
document.addEventListener("input",function(e){var el=e.target;var a=el.getAttribute&&el.getAttribute("data-act");
 if(a==="pname"){var pn=S.pending.filter(function(x){return x.k===el.getAttribute("data-k");})[0];pn.name=el.value;if(S.perr[pn.k]&&S.perr[pn.k].name&&el.value.trim()){S.perr[pn.k].name=0;el.classList.remove("err");var fe=document.getElementById("pe-"+pn.k);if(fe)fe.remove();}return;}if(a!=="level"&&a!=="pos")return;el.style.setProperty("--v",el.value+"%");var lb=document.querySelector('[data-lv="'+el.getAttribute("data-k")+'"]');if(lb)lb.textContent=el.value+"%";if(a==="level")dev(el.getAttribute("data-k")).level=+el.value;});
document.addEventListener("change",function(e){var el=e.target,a=el.getAttribute("data-act");
 if(a==="pos"){move(dev(el.getAttribute("data-k")),+el.value);}
 else if(a==="level"){addLog("You set the "+dev(el.getAttribute("data-k")).name.toLowerCase()+" to "+el.value+"%");document.getElementById("rail").innerHTML=renderRail();}
 else if(a==="proom"){var pr=S.pending.filter(function(x){return x.k===el.getAttribute("data-k");})[0];pr.room=el.value;if(S.perr[pr.k])S.perr[pr.k].room=0;render();}
 else if(a==="role"){S.role=el.value;S.msgs=[];render();toast("Signed in as "+el.options[el.selectedIndex].text);}
 else if(a==="theme"){S.theme=el.value;applyTheme();}
 else if(a==="timeout"){S.timeout=el.checked;}
 else if(a==="offline"){dev("l2").offline=el.checked;render();}});
document.addEventListener("submit",function(e){if(e.target.id!=="cform")return;e.preventDefault();var i=document.getElementById("msg");var v=i.value;i.value="";send(v);});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&S.modal&&S.modal.step==="pending"){S.modal=null;renderModal();}});
window.matchMedia("(min-width:1024px)").addEventListener("change",render);
window.edgeBack=function(){if(S.modal){if(S.modal.step==="pending"){S.modal=null;renderModal();}return true;}if(S.view!=="home"){S.view="home";render();window.scrollTo(0,0);return true;}return false;};
render();
})();
</script>
</body>
